server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers - Traefik (the production TLS-terminating proxy in
    # front of this container, see docker-compose.traefik.yml) doesn't add
    # any of these, so they have to come from here to reach the browser at
    # all. CSP's connect-src covers both the local-docker Gateway
    # (http://localhost:5000, see docker-compose.yml's VITE_API_BASE_URL)
    # and the real production Gateway (https://api.examvaults.in, see
    # docker-compose.prod.yml) since this same nginx.conf ships in both
    # images. Deliberately no Permissions-Policy here - the exam proctoring
    # feature (useProctoring.ts/LiveCameraCell.tsx) needs camera access,
    # and getting that directive wrong would silently break it; the four
    # headers below don't carry that risk.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' http://localhost:5000 https://api.examvaults.in; frame-ancestors 'none'" always;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
