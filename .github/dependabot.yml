# Weekly dependency-update pull requests against dev (CI runs on each one,
# including the vulnerability gates in ci.yml; nothing deploys until a PR is
# merged). Updates are grouped per ecosystem to keep the PR count small.
version: 2
updates:
  - package-ecosystem: nuget
    directory: "/"
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      nuget-minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: "/Frontend/examvault-web"
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        update-types: ["minor", "patch"]

  # Base images of every service's Dockerfile (.NET runtime/SDK, nginx, node).
  - package-ecosystem: docker
    directories:
      - "/Backend/**"
      - "/Frontend/examvault-web"
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      docker-images:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: "/"
    target-branch: dev
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
