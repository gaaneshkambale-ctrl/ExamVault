name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

jobs:
  backend:
    name: Backend (.NET)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore ExamVault.sln

      # Fails the build (and so blocks the CD deploy) on any NuGet package,
      # direct or transitive, with a known High/Critical vulnerability.
      # Moderate/Low are printed but don't fail.
      - name: Vulnerable NuGet packages (High/Critical fail)
        run: |
          dotnet list ExamVault.sln package --vulnerable --include-transitive 2>&1 | tee vulnerable-packages.txt
          if grep -qE '\b(High|Critical)\b' vulnerable-packages.txt; then
            echo "::error::NuGet packages with High/Critical vulnerabilities found (see above)."
            exit 1
          fi

      - name: Build
        run: dotnet build ExamVault.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test ExamVault.sln --no-build --configuration Release

  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend/examvault-web
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: Frontend/examvault-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Production dependencies only (what ships to browsers); High/Critical
      # fail the build. Dev-only tooling (vitest etc.) is not gated.
      - name: Audit production dependencies (High/Critical fail)
        run: npm audit --omit=dev --audit-level=high

      - name: Build
        run: npm run build

      - name: Test
        run: npm test --if-present
