x-jwt-env: &jwt-env
  Jwt__Issuer: ExamVault
  Jwt__Audience: ExamVault
  Jwt__SigningKey: ${JWT_SIGNING_KEY}
  Jwt__AccessTokenMinutes: "15"
  Jwt__RefreshTokenDays: "7"

x-rabbitmq-env: &rabbitmq-env
  RabbitMq__HostName: rabbitmq
  RabbitMq__Port: "5672"
  RabbitMq__UserName: ${RABBITMQ_USER}
  RabbitMq__Password: ${RABBITMQ_PASSWORD}
  RabbitMq__ExchangeName: examvault.events

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SQL_SA_PASSWORD}
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  user-api:
    build:
      context: .
      dockerfile: Backend/Services/UserService/OnlineExamSystem.User.API/Dockerfile
    environment:
      <<: [*jwt-env, *rabbitmq-env]
      ASPNETCORE_ENVIRONMENT: Docker
      ConnectionStrings__UserDb: Server=sqlserver;Database=ExamVault.UserDb;User Id=sa;Password=${SQL_SA_PASSWORD};TrustServerCertificate=True;
      N8n__WebhookUrl: ${N8N_USER_WEBHOOK_URL}
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "5010:8080"

  exam-api:
    build:
      context: .
      dockerfile: Backend/Services/ExamService/OnlineExamSystem.Exam.API/Dockerfile
    environment:
      <<: [*jwt-env, *rabbitmq-env]
      ASPNETCORE_ENVIRONMENT: Docker
      ConnectionStrings__ExamDb: Server=sqlserver;Database=ExamVault.ExamDb;User Id=sa;Password=${SQL_SA_PASSWORD};TrustServerCertificate=True;
      Services__UserServiceBaseUrl: http://user-api:8080
      Services__QuestionServiceBaseUrl: http://question-api:8080
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      user-api:
        condition: service_started
    ports:
      - "5020:8080"

  question-api:
    build:
      context: .
      dockerfile: Backend/Services/QuestionService/OnlineExamSystem.Question.API/Dockerfile
    environment:
      <<: [*jwt-env]
      ASPNETCORE_ENVIRONMENT: Docker
      ConnectionStrings__QuestionDb: Server=sqlserver;Database=ExamVault.QuestionDb;User Id=sa;Password=${SQL_SA_PASSWORD};TrustServerCertificate=True;
    depends_on:
      sqlserver:
        condition: service_healthy
    ports:
      - "5030:8080"

  ai-api:
    build:
      context: .
      dockerfile: Backend/Services/AiService/OnlineExamSystem.Ai.API/Dockerfile
    environment:
      <<: [*jwt-env]
      ASPNETCORE_ENVIRONMENT: Docker
      N8n__WebhookUrl: ${N8N_AI_WEBHOOK_URL}
    ports:
      - "5040:8080"

  submission-api:
    build:
      context: .
      dockerfile: Backend/Services/SubmissionService/OnlineExamSystem.Submission.API/Dockerfile
    environment:
      <<: [*jwt-env]
      ASPNETCORE_ENVIRONMENT: Docker
      ConnectionStrings__SubmissionDb: Server=sqlserver;Database=ExamVault.SubmissionDb;User Id=sa;Password=${SQL_SA_PASSWORD};TrustServerCertificate=True;
      Services__ExamServiceBaseUrl: http://exam-api:8080
      Metered__ApiKey: ${METERED_API_KEY}
      Metered__AppDomain: ${METERED_APP_DOMAIN}
    depends_on:
      sqlserver:
        condition: service_healthy
      exam-api:
        condition: service_started
    ports:
      - "5050:8080"

  result-api:
    build:
      context: .
      dockerfile: Backend/Services/ResultService/OnlineExamSystem.Result.API/Dockerfile
    environment:
      <<: [*jwt-env]
      ASPNETCORE_ENVIRONMENT: Docker
      Services__ExamServiceBaseUrl: http://exam-api:8080
      Services__QuestionServiceBaseUrl: http://question-api:8080
      Services__SubmissionServiceBaseUrl: http://submission-api:8080
    depends_on:
      - exam-api
      - question-api
      - submission-api
    ports:
      - "5060:8080"

  notification-api:
    build:
      context: .
      dockerfile: Backend/Services/NotificationService/OnlineExamSystem.Notification.API/Dockerfile
    environment:
      <<: [*jwt-env]
      ASPNETCORE_ENVIRONMENT: Docker
      ConnectionStrings__NotificationDb: Server=sqlserver;Database=ExamVault.NotificationDb;User Id=sa;Password=${SQL_SA_PASSWORD};TrustServerCertificate=True;
      Services__UserServiceBaseUrl: http://user-api:8080
      Services__ExamServiceBaseUrl: http://exam-api:8080
      N8n__WebhookUrl: ${N8N_NOTIFICATION_WEBHOOK_URL}
    depends_on:
      sqlserver:
        condition: service_healthy
      user-api:
        condition: service_started
      exam-api:
        condition: service_started
    ports:
      - "5001:8080"

  notification-worker:
    build:
      context: .
      dockerfile: Backend/Services/NotificationService/OnlineExamSystem.NotificationService.Worker/Dockerfile
    environment:
      <<: [*rabbitmq-env]
      DOTNET_ENVIRONMENT: Docker
      ConnectionStrings__NotificationDb: Server=sqlserver;Database=ExamVault.NotificationDb;User Id=sa;Password=${SQL_SA_PASSWORD};TrustServerCertificate=True;
      N8n__WebhookUrl: ${N8N_NOTIFICATION_WEBHOOK_URL}
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      notification-api:
        condition: service_started

  gateway:
    build:
      context: .
      dockerfile: Backend/Gateway/OnlineExamSystem.ApiGateway/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
    depends_on:
      - user-api
      - exam-api
      - question-api
      - ai-api
      - submission-api
      - result-api
      - notification-api
    ports:
      - "5000:8080"

  frontend:
    build:
      context: Frontend/examvault-web
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:5000
    depends_on:
      - gateway
    ports:
      - "5173:80"

volumes:
  sqlserver-data:
